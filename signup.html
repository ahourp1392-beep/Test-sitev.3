<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نمونه کار | ثبت نام</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Tahoma,Arial;
background:linear-gradient(135deg,#080b16,#17112d);
color:white;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.card{
width:min(420px,92%);
background:#111827;
padding:32px;
border-radius:24px;
box-shadow:0 25px 80px #0008;
}

h1{text-align:center}

.sub{
text-align:center;
color:#94a3b8;
margin-bottom:25px;
}

label{
display:block;
margin:12px 0 7px;
color:#cbd5e1;
}

input{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #334155;
background:#070b14;
color:white;
outline:none;
}

button{
width:100%;
padding:14px;
margin-top:15px;
border:0;
border-radius:12px;
background:linear-gradient(90deg,#7c3aed,#06b6d4);
color:white;
font-weight:bold;
cursor:pointer;
}

.back{
background:#1e293b;
}

.msg{
text-align:center;
min-height:25px;
margin-top:12px;
font-size:13px;
}

.error{color:#fb7185}
.success{color:#4ade80}
</style>
</head>

<body>

<div class="card">

<h1>ساخت حساب</h1>

<div class="sub">
یک حساب کاربری بساز
</div>

<label>نام کاربری</label>
<input id="username" placeholder="نام کاربری">

<label>رمز عبور</label>
<input id="password" type="password" placeholder="حداقل ۶ کاراکتر">

<label>تکرار رمز عبور</label>
<input id="password2" type="password" placeholder="تکرار رمز">

<button onclick="signup()">ثبت نام</button>

<div id="msg" class="msg"></div>

<button class="back" onclick="location.href='index.html'">
بازگشت به ورود
</button>

</div>

<script>
function signup(){

const username=document.getElementById("username").value.trim();
const password=document.getElementById("password").value;
const password2=document.getElementById("password2").value;

const msg=document.getElementById("msg");

msg.className="msg";

if(username.length<3){

msg.classList.add("error");
msg.textContent="نام کاربری حداقل ۳ کاراکتر باشد.";
return;
}

if(password.length<6){

msg.classList.add("error");
msg.textContent="رمز عبور حداقل ۶ کاراکتر باشد.";
return;
}

if(password!==password2){

msg.classList.add("error");
msg.textContent="رمزهای عبور یکسان نیستند.";
return;
}

if(username==="ahourapakpanah"){

msg.classList.add("error");
msg.textContent="این نام کاربری برای مدیر است.";
return;
}

let users=JSON.parse(localStorage.getItem("users")||"[]");

if(users.some(u=>u.username===username)){

msg.classList.add("error");
msg.textContent="این نام کاربری قبلاً ثبت شده.";
return;
}

users.push({
username:username,
password:password,
role:1
});

localStorage.setItem("users",JSON.stringify(users));

msg.classList.add("success");
msg.textContent="ثبت نام موفق بود! در حال انتقال...";

setTimeout(()=>{
location.href="index.html";
},800);

}
</script>

</body>
</html>
