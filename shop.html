<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>فروشگاه | نمونه کار</title>


  <style>

    * {
      box-sizing: border-box;

      margin: 0;

      padding: 0;
    }


    body {
      font-family:
        Tahoma,
        Arial,
        sans-serif;

      background: #f5f7fb;

      color: #111827;
    }


    header {
      position: sticky;

      top: 0;

      z-index: 10;

      background: white;

      border-bottom:
        1px solid #e5e7eb;

      padding: 15px 18px;

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 10px;
    }


    .logo {
      font-weight: bold;

      font-size: 19px;
    }


    .header-actions {
      display: flex;

      gap: 7px;

      align-items: center;
    }


    .header-btn {
      border: 0;

      padding: 9px 11px;

      border-radius: 10px;

      background: #f3f4f6;

      color: #111827;

      text-decoration: none;

      font-family: inherit;

      font-size: 12px;

      cursor: pointer;
    }


    .cart-btn {
      background: #111827;

      color: white;
    }


    .container {
      max-width: 1100px;

      margin: auto;

      padding: 25px 16px;
    }


    .hero {
      background:
        linear-gradient(
          135deg,
          #111827,
          #374151
        );

      color: white;

      border-radius: 24px;

      padding: 30px 22px;

      margin-bottom: 25px;
    }


    .hero h1 {
      font-size: 26px;

      margin-bottom: 8px;
    }


    .hero p {
      color: #d1d5db;

      line-height: 1.8;

      font-size: 14px;
    }


    .status {
      background: #eff6ff;

      color: #1d4ed8;

      padding: 12px;

      border-radius: 12px;

      margin-bottom: 20px;

      font-size: 13px;
    }


    .products {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(190px, 1fr)
        );

      gap: 17px;
    }


    .product {
      background: white;

      border-radius: 18px;

      overflow: hidden;

      box-shadow:
        0 5px 20px
        rgba(0,0,0,.05);
    }


    .product-image {
      width: 100%;

      height: 210px;

      object-fit: cover;

      background: #f3f4f6;

      display: block;
    }


    .no-image {
      width: 100%;

      height: 210px;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #f3f4f6;

      color: #9ca3af;

      font-size: 45px;
    }


    .product-content {
      padding: 15px;
    }


    .product-name {
      font-weight: bold;

      font-size: 16px;

      margin-bottom: 7px;
    }


    .product-description {
      color: #6b7280;

      font-size: 12px;

      line-height: 1.8;

      min-height: 43px;

      margin-bottom: 10px;
    }


    .product-bottom {
      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 8px;
    }


    .price {
      color: #2563eb;

      font-weight: bold;

      font-size: 14px;
    }


    .add-btn {
      border: 0;

      background: #111827;

      color: white;

      border-radius: 9px;

      padding: 9px 10px;

      font-family: inherit;

      cursor: pointer;

      font-size: 12px;
    }


    .cart-panel {
      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,.45);

      z-index: 100;

      display: none;

      align-items: flex-end;

      justify-content: center;
    }


    .cart-panel.open {
      display: flex;
    }


    .cart-box {
      background: white;

      width: 100%;

      max-width: 600px;

      max-height: 85vh;

      overflow-y: auto;

      border-radius:
        25px 25px 0 0;

      padding: 22px;
    }


    .cart-header {
      display: flex;

      justify-content:
        space-between;

      align-items: center;

      margin-bottom: 18px;
    }


    .close-btn {
      border: 0;

      background: #f3f4f6;

      width: 35px;

      height: 35px;

      border-radius: 50%;

      cursor: pointer;
    }


    .cart-item {
      display: flex;

      align-items: center;

      gap: 10px;

      padding: 10px 0;

      border-bottom:
        1px solid #eee;
    }


    .cart-item img {
      width: 55px;

      height: 55px;

      object-fit: cover;

      border-radius: 10px;
    }


    .cart-info {
      flex: 1;
    }


    .cart-name {
      font-weight: bold;

      font-size: 13px;
    }


    .cart-price {
      color: #2563eb;

      font-size: 12px;

      margin-top: 4px;
    }


    .remove-cart {
      border: 0;

      background: #fee2e2;

      color: #dc2626;

      border-radius: 8px;

      padding: 7px;

      cursor: pointer;
    }


    .empty {
      text-align: center;

      padding: 35px;

      color: #9ca3af;
    }


    .profile-box {
      background: white;

      border-radius: 18px;

      padding: 18px;

      margin-bottom: 20px;

      display: none;

      box-shadow:
        0 5px 20px
        rgba(0,0,0,.05);
    }


    .profile-name {
      font-weight: bold;

      margin-bottom: 5px;
    }


    .profile-user {
      color: #6b7280;

      font-size: 13px;
    }


    .logout {
      margin-top: 12px;

      border: 0;

      background: #fee2e2;

      color: #dc2626;

      padding: 9px 13px;

      border-radius: 9px;

      font-family: inherit;

      cursor: pointer;
    }


    @media(max-width:500px) {

      .products {
        grid-template-columns:
          repeat(2, 1fr);

        gap: 10px;
      }


      .product-image,
      .no-image {
        height: 170px;
      }


      .product-content {
        padding: 11px;
      }


      .product-name {
        font-size: 14px;
      }


      .product-description {
        font-size: 11px;
      }


      .product-bottom {
        flex-direction: column;

        align-items: stretch;
      }


      .add-btn {
        width: 100%;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="logo">
    🛍️ نمونه کار
  </div>


  <div class="header-actions">

    <button
      class="header-btn"
      onclick="toggleProfile()"
    >
      👤 پروفایل
    </button>


    <button
      class="header-btn cart-btn"
      onclick="openCart()"
    >
      🛒 سبد
      <span id="cartCount">0</span>
    </button>

  </div>

</header>



<div class="container">


  <div
    class="profile-box"
    id="profileBox"
  >

    <div
      class="profile-name"
      id="profileName"
    ></div>

    <div
      class="profile-user"
      id="profileUsername"
    ></div>

    <button
      class="logout"
      onclick="logout()"
    >
      خروج از حساب
    </button>

  </div>



  <div class="hero">

    <h1>
      فروشگاه
    </h1>

    <p>
      محصولات فروشگاه از فایل
      products.json
      دریافت می‌شوند.
    </p>

  </div>


  <div
    class="status"
    id="status"
  >
    در حال دریافت محصولات...
  </div>


  <div
    class="products"
    id="products"
  ></div>

</div>



<!-- CART -->

<div
  class="cart-panel"
  id="cartPanel"
  onclick="closeCartOutside(event)"
>

  <div class="cart-box">

    <div class="cart-header">

      <h2>
        🛒 سبد خرید
      </h2>

      <button
        class="close-btn"
        onclick="closeCart()"
      >
        ✕
      </button>

    </div>


    <div
      id="cartItems"
    ></div>

  </div>

</div>



<script>


let database = {

  users: [],

  products: []

};


let cart = [];



/* =====================================
   USER
===================================== */

const currentUser =
  JSON.parse(
    localStorage.getItem(
      "ahouranemone_logged_user"
    )
  );



/* =====================================
   CART
===================================== */

function getCartKey() {

  if (currentUser) {

    return (
      "ahouranemone_cart_" +
      currentUser.username
    );

  }

  return "ahouranemone_guest_cart";

}


function loadCart() {

  try {

    const saved =
      localStorage.getItem(
        getCartKey()
      );


    if (saved) {

      cart =
        JSON.parse(saved);

    }

  } catch {

    cart = [];

  }


  updateCartCount();

}



function saveCart() {

  localStorage.setItem(
    getCartKey(),
    JSON.stringify(cart)
  );

  updateCartCount();

}



function updateCartCount() {

  document
    .getElementById("cartCount")
    .textContent =
    cart.length;

}



/* =====================================
   LOAD JSON
===================================== */

async function loadDatabase() {

  try {

    const response =
      await fetch(
        "products.json?cache=" +
        Date.now()
      );


    if (!response.ok) {

      throw new Error();

    }


    database =
      await response.json();


    if (
      !Array.isArray(
        database.products
      )
    ) {

      database.products = [];

    }


    renderProducts();


  } catch {

    document
      .getElementById("status")
      .textContent =
      "❌ products.json پیدا نشد.";

  }

}



/* =====================================
   PRODUCTS
===================================== */

function renderProducts() {


  const container =
    document.getElementById(
      "products"
    );


  const products =
    database.products;


  if (!products.length) {

    container.innerHTML = `

      <div class="empty">

        هنوز محصولی اضافه نشده.

      </div>

    `;


    document
      .getElementById("status")
      .textContent =
      "فروشگاه فعلاً محصولی ندارد.";

    return;

  }


  document
    .getElementById("status")
    .textContent =
    products.length +
    " محصول در فروشگاه موجود است.";


  container.innerHTML =
    products
      .map(
        product => {


          const image =
            product.image;


          const imageHTML =
            image

              ?

              `
                <img
                  class="product-image"
                  src="${escapeHTML(
                    image
                  )}"
                  alt="${escapeHTML(
                    product.name
                  )}"
                >
              `

              :

              `
                <div class="no-image">
                  🛍️
                </div>
              `;


          return `

            <div class="product">

              ${imageHTML}


              <div class="product-content">

                <div class="product-name">

                  ${escapeHTML(
                    product.name
                  )}

                </div>


                <div class="product-description">

                  ${escapeHTML(
                    product.description ||
                    "بدون توضیحات"
                  )}

                </div>


                <div class="product-bottom">

                  <div class="price">

                    ${formatPrice(
                      product.price
                    )}

                    تومان

                  </div>


                  <button
                    class="add-btn"
                    onclick="addToCart(
                      ${product.id}
                    )"
                  >
                    افزودن به سبد
                  </button>

                </div>

              </div>

            </div>

          `;

        }
      )
      .join("");

}



/* =====================================
   ADD TO CART
===================================== */

function addToCart(id) {


  if (!currentUser) {

    alert(
      "برای افزودن به سبد خرید ابتدا وارد حساب شو."
    );


    window.location.href =
      "index.html";


    return;

  }


  const product =
    database.products.find(
      p =>
        p.id === id
    );


  if (!product) {

    return;

  }


  cart.push(product);


  saveCart();


  alert(
    "محصول به سبد خرید اضافه شد ✅"
  );

}



/* =====================================
   CART
===================================== */

function openCart() {

  renderCart();


  document
    .getElementById("cartPanel")
    .classList.add("open");

}



function closeCart() {

  document
    .getElementById("cartPanel")
    .classList.remove("open");

}



function closeCartOutside(event) {

  if (
    event.target.id ===
    "cartPanel"
  ) {

    closeCart();

  }

}



function renderCart() {


  const box =
    document.getElementById(
      "cartItems"
    );


  if (!cart.length) {

    box.innerHTML = `

      <div class="empty">

        سبد خرید خالی است.

      </div>

    `;

    return;

  }


  box.innerHTML =
    cart
      .map(
        (product, index) => `

          <div class="cart-item">

            ${
              product.image

              ?

              `
                <img
                  src="${escapeHTML(
                    product.image
                  )}"
                  alt=""
                >
              `

              :

              `
                <div
                  style="
                    width:55px;
                    height:55px;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    background:#f3f4f6;
                    border-radius:10px;
                  "
                >
                  🛍️
                </div>
              `
            }


            <div class="cart-info">

              <div class="cart-name">

                ${escapeHTML(
                  product.name
                )}

              </div>


              <div class="cart-price">

                ${formatPrice(
                  product.price
                )}

                تومان

              </div>

            </div>


            <button
              class="remove-cart"
              onclick="removeFromCart(
                ${index}
              )"
            >
              حذف
            </button>

          </div>

        `
      )
      .join("");

}



function removeFromCart(index) {

  cart.splice(
    index,
    1
  );

  saveCart();

  renderCart();

}



/* =====================================
   PROFILE
===================================== */

function toggleProfile() {


  const box =
    document.getElementById(
      "profileBox"
    );


  if (!currentUser) {

    window.location.href =
      "index.html";

    return;

  }


  document
    .getElementById("profileName")
    .textContent =
    currentUser.name;


  document
    .getElementById("profileUsername")
    .textContent =
    "@" +
    currentUser.username;


  box.style.display =
    box.style.display === "block"
      ? "none"
      : "block";

}



function logout() {

  localStorage.removeItem(
    "ahouranemone_logged_user"
  );


  window.location.href =
    "index.html";

}



/* =====================================
   HELPERS
===================================== */

function formatPrice(number) {

  return Number(number)
    .toLocaleString("fa-IR");

}



function escapeHTML(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



/* =====================================
   START
===================================== */

loadCart();

loadDatabase();

</script>


</body>

</html>
